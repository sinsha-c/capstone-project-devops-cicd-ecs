---
- name: Update apt cache
  ansible.builtin.apt: {update_cache: true, cache_valid_time: 3600}
- name: Install common packages
  ansible.builtin.apt:
    name: [curl, wget, unzip, git, jq, ca-certificates, gnupg, software-properties-common]
    state: present
- name: Set timezone to UTC
  ansible.builtin.command: timedatectl set-timezone UTC
  changed_when: false
